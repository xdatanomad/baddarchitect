name: lint social scripts

on:
  pull_request:
    paths: ["scripts/social/**"]
  push:
    branches: [main]
    paths: ["scripts/social/**"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          # -S error: fail only on real bugs, not style nits (SC2155 etc.)
          shellcheck -S error scripts/social/*.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: node --check
        run: |
          for f in scripts/social/*.mjs; do
            echo "checking $f"
            node --check "$f"
          done
